# VCL VibeBench — Vibe Vision suite (Tier 2, draft / unreleased)
# Multimodal PNG frame sequences. Run: MODELS=… npm run eval:vision
# Protocol: blind prompt (no motion hint). Hinted runs are a separate follow-up.
#
# Providers without reliable multi-image support should be marked unsupported
# in result notes — do not treat as scored fails.

description: "VCL VibeBench — Vibe Vision (draft)"

prompts:
  - |
    These images are consecutive frames from a short silent animation (same scene over time).
    What single word is revealed across the frames? Reply with ONLY the word in uppercase,
    or CANNOT_TELL if you cannot determine it.
    {{frame1}}
    {{frame2}}
    {{frame3}}
    {{frame4}}
    {{frame5}}
    {{frame6}}

providers: []

tests:
  - description: "Motion word — OCEAN (neutral)"
    metadata:
      scoring: scored
      case_id: ocean
      protocol: blind
    vars:
      frame1: file://cases/ocean/frames/frame-01.png
      frame2: file://cases/ocean/frames/frame-03.png
      frame3: file://cases/ocean/frames/frame-05.png
      frame4: file://cases/ocean/frames/frame-07.png
      frame5: file://cases/ocean/frames/frame-09.png
      frame6: file://cases/ocean/frames/frame-11.png
    assert:
      - type: icontains
        value: "OCEAN"

  - description: "Motion word — QUIET (neutral)"
    metadata:
      scoring: scored
      case_id: quiet
      protocol: blind
    vars:
      frame1: file://cases/quiet/frames/frame-01.png
      frame2: file://cases/quiet/frames/frame-03.png
      frame3: file://cases/quiet/frames/frame-05.png
      frame4: file://cases/quiet/frames/frame-07.png
      frame5: file://cases/quiet/frames/frame-09.png
      frame6: file://cases/quiet/frames/frame-11.png
    assert:
      - type: icontains
        value: "QUIET"

  - description: "Motion word — PIXEL (neutral)"
    metadata:
      scoring: scored
      case_id: pixel
      protocol: blind
    vars:
      frame1: file://cases/pixel/frames/frame-01.png
      frame2: file://cases/pixel/frames/frame-03.png
      frame3: file://cases/pixel/frames/frame-05.png
      frame4: file://cases/pixel/frames/frame-07.png
      frame5: file://cases/pixel/frames/frame-09.png
      frame6: file://cases/pixel/frames/frame-11.png
    assert:
      - type: icontains
        value: "PIXEL"

  - description: "Motion word — RIVER with decoy BRIDGE"
    metadata:
      scoring: scored
      case_id: decoy-river
      protocol: blind
      decoy: BRIDGE
    vars:
      frame1: file://cases/decoy-river/frames/frame-01.png
      frame2: file://cases/decoy-river/frames/frame-03.png
      frame3: file://cases/decoy-river/frames/frame-05.png
      frame4: file://cases/decoy-river/frames/frame-07.png
      frame5: file://cases/decoy-river/frames/frame-09.png
      frame6: file://cases/decoy-river/frames/frame-11.png
    assert:
      - type: icontains
        value: "RIVER"
