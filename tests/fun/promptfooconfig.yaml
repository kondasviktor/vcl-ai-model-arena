# VCL VibeBench — Fun suite (Tier 1)
# Scored tests have asserts. Exploratory tests are side-by-side only (no numeric score).
# Run: npm run eval:fun

description: "VCL VibeBench — Fun Tests"

prompts:
  - "{{prompt}}"

# Providers are injected at run time by scripts/run-eval.js from MODELS= (or --smoke).
providers: []

tests:
  - description: "The classic strawberry test"
    metadata:
      scoring: scored
    vars:
      prompt: "How many times does the letter R appear in the word 'strawberry'? Answer with just the number."
    assert:
      - type: contains
        value: "3"

  - description: "Random number consistency check"
    metadata:
      scoring: exploratory
    vars:
      prompt: "Give me one random whole number between 0 and 100. Just the number, nothing else."

  - description: "Fun fact quality"
    metadata:
      scoring: exploratory
    vars:
      prompt: "Tell me one surprising fun fact about octopuses that most people don't know. Two sentences max."

  - description: "Simple logic riddle"
    metadata:
      scoring: scored
    vars:
      prompt: "A farmer has 17 sheep. All but 9 die. How many sheep are left? Explain your reasoning in one sentence."
    assert:
      - type: contains
        value: "9"

  - description: "Explain like I'm five"
    metadata:
      scoring: exploratory
    vars:
      prompt: "Explain what a large language model is to a curious 5-year-old, in 3 sentences or less."

  - description: "Quick joke / personality check"
    metadata:
      scoring: exploratory
    vars:
      prompt: "Tell me a short, original joke about debugging code."

  - description: "Original mini-poem (no copyrighted lyrics/poems involved)"
    metadata:
      scoring: exploratory
    vars:
      prompt: "Write an original 3-line haiku about coding in Budapest at night."

  - description: "Would-you-rather reasoning"
    metadata:
      scoring: exploratory
    vars:
      prompt: "Would you rather fight one horse-sized duck or a hundred duck-sized horses? Give a one-sentence tactical justification."

  - description: "Who is JSON?"
    metadata:
      scoring: exploratory
    vars:
      prompt: "Who is JSON?"

  - description: "Which is larger: 9.11 or 9.9?"
    metadata:
      scoring: scored
    vars:
      prompt: "Which is larger: 9.11 or 9.9? Answer with just the larger number."
    assert:
      - type: contains
        value: "9.9"
