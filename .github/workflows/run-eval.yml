name: Run VibeBench Eval

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Which suite to run"
        required: true
        default: "fun"
        type: choice
        options:
          - fun
          - dev

concurrency:
  group: vibebench-eval
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Require OpenRouter secret
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "Missing OPENROUTER_API_KEY repository secret"
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Validate registry alignment
        run: npm run validate:registry

      - name: Run promptfoo eval
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          DATE=$(date +%Y-%m-%d)
          echo "Suite=${{ inputs.suite }} Date=$DATE"
          npx promptfoo eval \
            -c tests/${{ inputs.suite }}/promptfooconfig.yaml \
            -o results/${{ inputs.suite }}-$DATE.json
          node scripts/write-result-meta.js ${{ inputs.suite }} $DATE maintainer
          npm run results:latest

      - name: Commit results
        run: |
          git config user.name "vibebench-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Add ${{ inputs.suite }} results $(date +%Y-%m-%d)"
            git push
          fi
