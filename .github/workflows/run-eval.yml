name: Run VibeBench Eval

# Trigger manually from the Actions tab whenever a new model drops.
# Results get committed to /results so the repo keeps a running history.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Which suite to run"
        required: true
        default: "fun"
        type: choice
        options:
          - fun
          - dev

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run promptfoo eval
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          DATE=$(date +%Y-%m-%d)
          npx promptfoo@latest eval \
            -c tests/${{ inputs.suite }}/promptfooconfig.yaml \
            -o results/${{ inputs.suite }}-$DATE.json

      - name: Commit results
        run: |
          git config user.name "vibebench-bot"
          git config user.email "bot@vibecoderslife.com"
          git add results/
          git commit -m "Add ${{ inputs.suite }} results $(date +%Y-%m-%d)" || echo "Nothing to commit"
          git push
